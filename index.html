<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fitness Is My Passion</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root{--red:#C0392B;--amber:#D4820A;--purple:#7D3C98;--blue:#2471A3;--green:#1E8449;--light:#888;--bg:#0E0E0E;--card:#181818;--border:#2A2A2A;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:#E8E8E8;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,20px);min-height:100dvh;}
  .header{position:sticky;top:0;z-index:100;background:rgba(14,14,14,0.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .app-title{font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--light);text-transform:uppercase;}
  .header-actions{display:flex;gap:5px;}
  .btn-upload{background:#1C1C1E;border:1px solid var(--border);color:var(--light);font-size:11px;padding:5px 9px;border-radius:20px;cursor:pointer;}
  .day-selector{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:4px;}
  .day-pill{padding:8px 2px;border-radius:20px;text-align:center;width:100%;border:1px solid #444;background:#1C1C1E;color:#C8C8C8;font-size:12px;font-weight:600;cursor:pointer;transition:background 0.15s,color 0.15s,border-color 0.15s;}
  .day-pill.today{background:var(--green);border-color:var(--green);color:#fff;}
  .day-pill.selected-other{background:var(--red);border-color:var(--red);color:#fff;opacity:0.35;}
  .day-pill.complete{border-color:#2A4A2A;color:var(--green);}
  .day-pill.today.complete,.day-pill.selected-other.complete{color:#fff;}
  .day-pill.future-locked,.day-pill.past-locked{opacity:0.35;cursor:pointer;}
  .timer-bar{margin:12px 0 0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .timer-display{font-size:26px;font-weight:300;color:#fff;font-variant-numeric:tabular-nums;min-width:56px;letter-spacing:0.02em;}
  .timer-display.running{color:var(--amber);}
  .timer-presets{display:flex;gap:6px;flex:1;}
  .preset-btn{flex-shrink:0;width:70px;padding:7px 0;border-radius:20px;text-align:center;border:1px solid var(--border);background:transparent;color:#E8E8E8;font-size:14px;font-weight:500;cursor:pointer;}
  .preset-btn:active{background:#2A2A2A;}
  .timer-controls{display:flex;gap:6px;}
  .ctrl-btn{flex-shrink:0;width:70px;padding:7px 0;border-radius:20px;border:none;cursor:pointer;text-align:center;font-size:13px;font-weight:600;color:#fff;transition:opacity 0.15s;}
  .ctrl-btn:active{opacity:0.8;}
  .ctrl-play{background:var(--green);}
  .ctrl-reset{background:var(--red);}
  .timer-flash{display:none;position:fixed;inset:0;z-index:500;background:#CCFF00;pointer-events:none;animation:flashFade 0.4s ease-out forwards;}
  @keyframes flashFade{0%{opacity:0.85;}100%{opacity:0;}}
  .content{padding:0 10px 40px;}
  .start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:60vh;padding:24px;}
  .start-day-title{font-size:22px;font-weight:700;color:var(--red);margin-bottom:6px;}
  .start-day-sub{font-size:14px;color:var(--light);margin-bottom:32px;line-height:1.5;}
  .start-btn{background:var(--green);color:#fff;font-size:17px;font-weight:700;padding:16px 48px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(30,132,73,0.35);}
  .start-btn:active{opacity:0.85;}
  .day-header{padding:8px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:12px;}
  .day-title{font-size:19px;font-weight:700;color:var(--red);letter-spacing:-0.01em;}
  .day-subtitle{font-size:12px;color:var(--light);margin-top:2px;}
  .overall-progress{margin-top:8px;}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--light);margin-bottom:4px;}
  .progress-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s ease;}
  .section{margin-bottom:16px;}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .section-label{font-size:13px;font-weight:600;letter-spacing:0.03em;padding:4px 0;}
  .section-label.main{color:var(--amber);}
  .section-label.finish{color:var(--purple);}
  .section-label.core{color:var(--blue);}
  .section-label.cardio{color:var(--green);}
  .section-progress{display:flex;align-items:center;gap:4px;}
  .section-pip{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background 0.2s;}
  .section-pip.done{background:var(--green);}
  .exercise-item{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden;}
  .exercise-item.locked{opacity:0.4;pointer-events:none;}
  .exercise-item.all-done{opacity:0.5;}
  .exercise-main-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .exercise-main-row:active{background:#222;}
  .exercise-text{font-size:14px;color:#D8D8D8;line-height:1.4;flex:1;}
  .exercise-item.all-done .exercise-text{text-decoration:line-through;color:var(--light);}
  .set-counter{display:flex;align-items:center;gap:3px;flex-shrink:0;margin-top:2px;}
  .set-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background 0.15s;flex-shrink:0;}
  .set-dot.done{background:var(--green);}
  .set-bar{height:2px;background:linear-gradient(to right,var(--green) var(--pct,0%),var(--border) var(--pct,0%));}
  .rest-note{font-size:12px;color:var(--light);font-style:italic;padding:4px 4px 8px;}
  .day-locked-msg{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:14px;background:transparent;border:1px solid #2A4A2A;border-radius:10px;color:var(--green);font-size:14px;font-weight:500;}
  .order-lock-btn{display:block;width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid #7D5A00;color:var(--amber);border-radius:10px;font-size:14px;cursor:pointer;text-align:center;}
  .order-lock-btn.unlocked{color:var(--green);border-color:#2A4A2A;}
  .order-lock-btn:active{background:#1C1C1E;}
  .reset-day-btn{display:block;width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid var(--border);color:var(--light);border-radius:10px;font-size:14px;cursor:pointer;text-align:center;}
  .reset-day-btn:active{background:#1C1C1E;}
  .completion-overlay{display:none;position:fixed;inset:0;z-index:300;align-items:center;justify-content:center;background:rgba(0,0,0,0.82);padding:32px;text-align:center;}
  .completion-overlay.visible{display:flex;}
  .completion-card{background:#1C1C1E;border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:100%;max-width:340px;}
  .completion-emoji{font-size:56px;margin-bottom:12px;}
  .completion-title{font-size:26px;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:-0.02em;}
  .completion-sub{font-size:15px;color:var(--light);margin-bottom:28px;line-height:1.5;}
  .completion-close{background:var(--green);color:#fff;font-size:16px;font-weight:700;padding:14px 32px;border-radius:12px;border:none;cursor:pointer;width:100%;}
  .completion-close:active{opacity:0.85;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--light);}
  .empty-state h2{font-size:18px;color:#E8E8E8;margin-bottom:8px;}
  .empty-state p{font-size:14px;line-height:1.6;margin-bottom:20px;}

  .btn-upload.disabled{opacity:0.35;pointer-events:none;}
  .edit-day-selector{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
  .edit-section{margin-bottom:18px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .edit-section-label{font-size:13px;font-weight:600;letter-spacing:0.03em;margin-bottom:10px;}
  .edit-section-label.main{color:var(--amber);}
  .edit-section-label.finish{color:var(--purple);}
  .edit-section-label.core{color:var(--blue);}
  .edit-section-label.cardio{color:var(--green);}
  .edit-exercise-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .edit-input{flex:1;background:#0E0E0E;border:1px solid var(--border);border-radius:8px;color:#E8E8E8;font-size:13px;padding:8px 10px;min-width:0;}
  .edit-input:focus{outline:none;border-color:var(--amber);}
  .edit-remove-btn{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:transparent;border:1px solid var(--red);color:var(--red);font-size:16px;cursor:pointer;line-height:1;}
  .edit-remove-btn:active{background:rgba(192,57,43,0.15);}
  .edit-add-btn{width:100%;padding:9px;margin-top:4px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--light);font-size:13px;cursor:pointer;}
  .edit-add-btn:active{background:#1C1C1E;}
  .edit-cardio-row{display:flex;gap:6px;}
  .edit-footer{display:flex;gap:8px;margin-top:20px;}
  .edit-cancel-btn{flex:1;padding:12px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  .edit-cancel-btn:active{opacity:0.85;}
  .edit-save-btn{flex:1;padding:12px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .edit-save-btn:active{opacity:0.85;}
</style>
</head>
<body>
<div class="timer-flash" id="timerFlash"></div>
<div class="header">
  <div class="header-top">
    <span class="app-title">Fitness Is My Passion</span>
    <div class="header-actions">
      <button class="btn-upload" id="editPlanBtn" onclick="handleEditPlanTap()">Edit Workout Plan</button>
    </div>
  </div>
  <div class="day-selector" id="daySelector"></div>
  <div class="timer-bar">
    <div class="timer-display" id="timerDisplay">0:00</div>
    <div class="timer-presets">
      <button class="preset-btn" onclick="setAndStart(30)">30s</button>
      <button class="preset-btn" onclick="setAndStart(120)">2m</button>
    </div>
    <div class="timer-controls">
      <button class="ctrl-btn ctrl-play" id="playPauseBtn" onclick="toggleTimer()">Play</button>
      <button class="ctrl-btn ctrl-reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>
</div>
<div class="content" id="content"></div>
<div class="completion-overlay" id="completionOverlay">
  <div class="completion-card">
    <div class="completion-emoji">🔥</div>
    <div class="completion-title">Workout Complete!</div>
    <div class="completion-sub" id="completionSub"></div>
    <button class="completion-close" onclick="closeCompletion()">Done</button>
  </div>
</div>
<div class="completion-overlay" id="savePromptOverlay">
  <div class="completion-card">
    <div class="completion-emoji">📝</div>
    <div class="completion-title">Save Changes?</div>
    <div class="completion-sub">You have unsaved changes to this day. Save before switching?</div>
    <div style="display:flex;gap:8px;">
      <button class="edit-save-btn" onclick="confirmDaySwitch()">Save</button>
      <button class="edit-cancel-btn" onclick="cancelDaySwitch()">Cancel</button>
    </div>
  </div>
</div>
<script>
'use strict';
const HARDCODED={
  Monday:{title:'Monday — Heavy Chest + Back',type:'workout',sections:[
    {label:'🥵 Main Work',type:'main',rest:'Rest 2 minutes between sets',exercises:['Floor Press — 4x12-15 @ 50 lbs','Neutral Grip Floor Press — 4x12-15 @ 40 lbs','One-Arm Row — 4x12-15 @ 40 lbs','Feet Elevated Push-Ups — 4x12–15']},
    {label:'🔥 Finisher',type:'finish',rest:'Rest 30 seconds between sets',exercises:['DB Pullover — 4x10 @ 30 lbs','Push-Ups — 4x10']},
    {label:'💀 Core Finisher',type:'core',rest:'Rest 30 seconds between sets',exercises:['Dead Bug — 3x8 each side (slow, controlled)','Dead Bug with Contralateral Hold — 3x8 each side (hold 2-3 sec at full extension)']},
    {label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Free Ride — 20 min'}]},
  Tuesday:{title:'Tuesday — Chest + Back (Volume & Stretch)',type:'workout',sections:[
    {label:'🥵 Main Work',type:'main',rest:'Rest 2 minutes between sets',exercises:['Deficit Push-Ups — 4x12-15','DB Floor Fly — 4x12–15 @ 35 lbs','Feet Elevated Push-Ups — 4x12–15','Bent-Over Rows — 4x12–15 @ 35 lbs']},
    {label:'🔥 Finisher',type:'finish',rest:'Rest 30 seconds between sets',exercises:['DB Pullover — 4x8 @ 35 lbs','Rear Delt Fly — 4x8 @ 15 lbs']},
    {label:'💀 Core Finisher',type:'core',rest:'Rest 30 seconds between sets',exercises:['Windshield Wiper — 3x14 (slow, controlled)','Tabletop Tuck Up — 3x12 (slow, controlled)']},
    {label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Free Ride — 20 min'}]},
  Wednesday:{title:'Wednesday — Shoulders + Arms (Hypertrophy)',type:'workout',sections:[
    {label:'🥵 Main Work',type:'main',rest:'Rest 2 minutes between sets',exercises:['Shoulder Press — 4x12–15 @ 25 lbs','Lateral Raises — 4x12–15 @ 15 lbs','Rear Delt Fly — 3x12–15 @ 15 lbs','DB Curl — 4x10–12 @ 25 lbs','Overhead Tricep Extension — 4x10–12 @ 25 lbs (1 DB)']},
    {label:'🔥 Finisher',type:'finish',rest:'Rest 30 seconds between sets',exercises:['DB Thrusters — 3x10 @ 15 lbs','Rear Delt Fly — 3x12 @ 15 lbs']},
    {label:'💀 Core Finisher',type:'core',rest:'Rest 30 seconds between sets',exercises:['DB Vertical Leg Crunch — 3x12 @ 20 lbs (1 DB)','Lying Leg Raise — 3x12 (arms flat, lower back down, crunch up)']},
    {label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Planned Class — 20 min'}]},
  Thursday:{title:'Thursday — Shoulders + Arms (Strength)',type:'workout',sections:[
    {label:'🥵 Main Work',type:'main',rest:'Rest 2 minutes between sets',exercises:['Heavy Shoulder Press — 4x10-12 @ 30 lbs','Lateral Raises — 4x10–12 @ 20 lbs','Rear Delt Fly — 3x10–12 @ 20 lbs','Heavy Alternating Curl — 4x10-12 @ 30 lbs','Close-Grip Floor Press — 4x10–12 @ 30 lbs']},
    {label:'🔥 Finisher',type:'finish',rest:'Rest 30 seconds between sets',exercises:['Tricep Kickbacks — 3x12 @ 20 lbs','Hammer Curl — 3x10 @ 30 lbs']},
    {label:'💀 Core Finisher',type:'core',rest:'Rest 30 seconds between sets',exercises:['Vertical Leg Crunch — 3x12','Dead Bug — 3x12 each side (slow, controlled)']},
    {label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Planned Class — 20 min'}]},
  Friday:{title:'Friday — Chest + Back (Pump)',type:'workout',sections:[
    {label:'🥵 Main Work',type:'main',rest:'Rest 2 minutes between sets',exercises:['High-Rep DB Squeeze Press — 4x15-18 @ 35 lbs','High-Rep Rear Delt Fly — 4x15-18 @ 15 lbs','Renegade Row — 3x10 each side @ 35 lbs','Feet Elevated Push-Ups — 4x15-18','High-Rep Bent-Over Rows — 4x15-18 @ 35 lbs']},
    {label:'🔥 Finisher',type:'finish',rest:'Rest 30 seconds between sets',exercises:['Close-Grip Push-Ups — 3x10-12','DB Sumo Squat — 3x10 @ 20 lbs (1 DB)']},
    {label:'💀 Core Finisher',type:'core',rest:'Rest 30 seconds between sets',exercises:['Tabletop Tuck Up — 3x15 (slow, controlled)','Mountain Climbers — 3x40 total reps']},
    {label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Free Ride — 20 min'}]},
  Saturday:{title:'Saturday — Ride Day',type:'workout',sections:[{label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Planned Ride — 45 min'}]},
  Sunday:{title:'Sunday — Ride Day',type:'workout',sections:[{label:'🚴 Cardio',type:'cardio',cardioText:'Peloton Planned Ride — 45 min'}]},
};
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let workout=loadWorkout(),currentDay=getCurrentDay();
let sets={},started={},orderUnlocked={};
let editMode=false, editDay=null, editWorkoutDraft=null, editDirty=false, pendingEditDaySwitch=null;

function todayKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),j=new Date(d.getFullYear(),0,1);return`${d.getFullYear()}-W${Math.ceil(((d-j)/86400000+j.getDay()+1)/7)}`;}
function getCurrentDay(){return DAYS[[6,0,1,2,3,4,5][new Date().getDay()]];}
function getDayIndex(d){return DAYS.indexOf(d);}
function isDayAccessible(d){return d===getCurrentDay();}
function isDayFuture(d){return getDayIndex(d)>getDayIndex(getCurrentDay());}
function isDayPast(d){return getDayIndex(d)<getDayIndex(getCurrentDay());}
function loadWorkout(){try{const s=localStorage.getItem('wt_workout');if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(HARDCODED));}
function loadState(){try{const s=localStorage.getItem('wt_state_'+todayKey());if(s){const d=JSON.parse(s);sets=d.sets||{};started=d.started||{};orderUnlocked=d.orderUnlocked||{};return;}}catch(e){}sets={};started={};orderUnlocked={};}
function saveState(){localStorage.setItem('wt_state_'+todayKey(),JSON.stringify({sets,started,orderUnlocked}));}
function parseSets(t){const m=t.match(/(\d+)x\d+/);return m?parseInt(m[1]):1;}
function getExerciseId(d,si,ei){return`${d}-${si}-${ei}`;}
function getTotalSets(d,si,ei){return parseSets(workout[d].sections[si].exercises[ei]);}
function getSetsForExercise(d,si,ei){return sets[getExerciseId(d,si,ei)]||0;}
function isExerciseDone(d,si,ei){return getSetsForExercise(d,si,ei)>=getTotalSets(d,si,ei);}
function isSectionDone(d,si){const s=workout[d].sections[si];return!s.exercises||s.exercises.every((_,ei)=>isExerciseDone(d,si,ei));}
function isDayComplete(d){const data=workout[d];if(!data||data.type!=='workout'||!started[d])return false;return data.sections.every((s,si)=>s.type==='cardio'?!!sets[`cardio-${d}-${si}`]:isSectionDone(d,si));}
function isAnyWorkoutInProgress(){return DAYS.some(d=>started[d]&&!isDayComplete(d));}
function getDayProgress(d){const data=workout[d];if(!data||!data.sections)return{done:0,total:0};let done=0,total=0;data.sections.forEach((s,si)=>{if(s.type==='cardio'){total++;done+=sets[`cardio-${d}-${si}`]?1:0;}else if(s.exercises)s.exercises.forEach((_,ei)=>{total+=getTotalSets(d,si,ei);done+=Math.min(getSetsForExercise(d,si,ei),getTotalSets(d,si,ei));});});return{done,total};}
function getSectionProgress(d,si){const s=workout[d].sections[si];if(s.type==='cardio')return{done:sets[`cardio-${d}-${si}`]?1:0,total:1};if(!s.exercises)return{done:0,total:0};let done=0,total=0;s.exercises.forEach((_,ei)=>{total+=getTotalSets(d,si,ei);done+=Math.min(getSetsForExercise(d,si,ei),getTotalSets(d,si,ei));});return{done,total};}
function getNextExerciseId(d){const data=workout[d];if(!data)return null;for(let si=0;si<data.sections.length;si++){const s=data.sections[si];if(!s.exercises)continue;for(let ei=0;ei<s.exercises.length;ei++)if(!isExerciseDone(d,si,ei))return getExerciseId(d,si,ei);}return null;}
function isExerciseLocked(d,si,ei){if(!isDayAccessible(d))return true;if(orderUnlocked[d])return false;return getExerciseId(d,si,ei)!==getNextExerciseId(d);}
function autoStartTimer(d,si,ei,newDone){const data=workout[d],sec=data&&data.sections[si];if(!sec||!sec.exercises)return;const isLastSet=newDone>=getTotalSets(d,si,ei);const lastSi=data.sections.reduce((l,s,i)=>(s.exercises?.length>0?i:l),-1);const lastEi=lastSi>=0?data.sections[lastSi].exercises.length-1:-1;if(si===lastSi&&ei===lastEi&&isLastSet){resetTimer();return;}const secs={main:120,finish:30,core:30}[sec.type];if(secs)setAndStart(secs);}

function render(){renderDaySelector();renderContent();refreshEditButtonState();}

function renderDaySelector(){
  const sel=document.getElementById('daySelector');sel.innerHTML='';
  const today=getCurrentDay();
  DAYS.forEach(d=>{
    const isSel=d===currentDay,isToday=d===today,isDone=isDayComplete(d),future=isDayFuture(d),past=isDayPast(d);
    const btn=document.createElement('button');
    let cls='day-pill';
    if(isSel&&isToday)cls+=' today';else if(isSel)cls+=' selected-other';else if(isToday)cls+=' today';
    if(isDone)cls+=' complete';
    if(future)cls+=' future-locked';
    if(past&&!isSel)cls+=' past-locked';
    btn.className=cls;btn.textContent=d.slice(0,3);
    btn.onclick=future?()=>{currentDay=d;renderDaySelector();renderContentPreview();}:()=>{currentDay=d;render();};
    sel.appendChild(btn);
  });
}

function renderContent(){
  const el=document.getElementById('content'),data=workout[currentDay];
  if(!data){el.innerHTML='<div class="empty-state"><h2>No workout loaded</h2><p>Use Edit Workout Plan to build your first day.</p></div>';return;}
  const isDone=isDayComplete(currentDay),isStarted=!!started[currentDay],past=isDayPast(currentDay),accessible=isDayAccessible(currentDay);
  if(isDone){renderContentAsComplete();return;}
  if(!isStarted){
    if(past){renderContentPastDay(currentDay);return;}
    const p=data.title.split(' — ');
    el.innerHTML=`<div class="start-screen"><div class="start-day-title">${p[0]}</div><div class="start-day-sub">${p.slice(1).join(' — ')}</div>${accessible?'<button class="start-btn" onclick="startWorkout()">Start Workout</button>':`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;"><div class="day-locked-msg" style="margin-top:0;border-color:#2A2A2A;color:var(--light);">🔒 Not yet — come back ${p[0]}</div><button class="reset-day-btn" style="margin-top:0;border-color:#2A2A2A;color:var(--light);width:auto;padding:10px 28px;" onclick="previewDay()">View Workout</button></div>`}</div>`;
    return;
  }
  const p=data.title.split(' — '),prog=getDayProgress(currentDay),pct=prog.total?Math.round((prog.done/prog.total)*100):0;
  let html=`<div class="day-header"><div class="day-title">${p[0]}</div><div class="day-subtitle">${p.slice(1).join(' — ')}</div><div class="overall-progress"><div class="progress-label"><span></span><span>${pct}%</span></div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div></div>`;
  data.sections.forEach((sec,si)=>{
    const tc={main:'main',finish:'finish',core:'core',cardio:'cardio'}[sec.type]||'main';
    const sp=getSectionProgress(currentDay,si);
    html+=`<div class="section"><div class="section-header"><div class="section-label ${tc}">${sec.label}</div>${sp.total>0?`<div class="section-progress">${Array.from({length:sp.total},(_,i)=>`<div class="section-pip${i<sp.done?' done':''}"></div>`).join('')}</div>`:''}</div>`;
    if(sec.type==='cardio'){
      const cid=`cardio-${currentDay}-${si}`,cdone=!!sets[cid],cl=!orderUnlocked[currentDay]&&getNextExerciseId(currentDay)!==null;
      html+=`<div class="exercise-item${cdone?' all-done':''}${cl?' locked':''}" style="${cl?'opacity:0.35;':''}" onclick="tapCardio('${currentDay}',${si})"><div class="exercise-main-row" style="cursor:pointer;"><div class="exercise-text">${sec.cardioText}</div><div class="set-counter"><div class="set-dot${cdone?' done':''}"></div></div></div><div class="set-bar" style="--pct:${cdone?100:0}%"></div></div>`;
    } else {
      sec.exercises.forEach((ex,ei)=>{
        const id=getExerciseId(currentDay,si,ei),total=getTotalSets(currentDay,si,ei),done=getSetsForExercise(currentDay,si,ei),allDone=done>=total,locked=isExerciseLocked(currentDay,si,ei),pctF=Math.round((done/total)*100);
        const dots=Array.from({length:total},(_,i)=>`<div class="set-dot${i<done?' done':''}"></div>`).join('');
        html+=`<div class="exercise-item${allDone?' all-done':''}${locked?' locked':''}" id="ex-${id}" style="${locked&&!allDone?'opacity:0.35;':''}"><div class="exercise-main-row" onclick="tapSet('${currentDay}',${si},${ei})"><div class="exercise-text">${ex}</div><div class="set-counter">${dots}</div></div><div class="set-bar" style="--pct:${pctF}%"></div></div>`;
      });
      if(sec.rest)html+=`<div class="rest-note">${sec.rest}</div>`;
    }
    html+=`</div>`;
  });
  if(accessible){
    const ul=!!orderUnlocked[currentDay];
    html+=`<button class="order-lock-btn${ul?' unlocked':''}" onclick="toggleOrderLock()">${ul?'🔓 Exercise Order Unlocked':'🔒 Lock Exercise Order'}</button>`;
    html+=`<button class="reset-day-btn" id="resetDayBtn" onclick="resetDay()">Reset ${currentDay}</button>`;
  }
  el.innerHTML=html;
}

function renderContentAsComplete(){
  const el=document.getElementById('content'),data=workout[currentDay],p=data.title.split(' — ');
  let html=`<div class="day-header"><div class="day-title">${p[0]}</div><div class="day-subtitle">${p.slice(1).join(' — ')}</div><div class="day-locked-msg" style="margin-top:8px;border-color:#2A4A2A;color:var(--green);">✓ ${p[0]} complete</div></div>`;
  html+=renderPreviewSections(data);
  el.innerHTML=html;
}

function renderContentPastDay(d){
  const el=document.getElementById('content'),data=workout[d],p=data.title.split(' — ');
  let html=`<div class="day-header"><div class="day-title">${p[0]}</div><div class="day-subtitle">${p.slice(1).join(' — ')}</div><div class="day-locked-msg" style="margin-top:8px;">✓ ${p[0]} complete</div></div>`;
  html+=renderPreviewSections(data);
  html+=`<button class="reset-day-btn" onclick="currentDay=getCurrentDay();render();" style="border-color:#2A2A2A;color:var(--light);">← Back to today</button>`;
  el.innerHTML=html;
}

function renderContentPreview(){
  const el=document.getElementById('content'),data=workout[currentDay],p=data.title.split(' — ');
  let html=`<div class="day-header"><div class="day-title">${p[0]}</div><div class="day-subtitle">${p.slice(1).join(' — ')}</div><div class="day-locked-msg" style="margin-top:8px;border-color:#7D5A00;color:var(--amber);">Preview only</div></div>`;
  html+=renderPreviewSections(data);
  html+=`<button class="reset-day-btn" onclick="currentDay=getCurrentDay();render();" style="border-color:#2A2A2A;color:var(--light);">← Back to today</button>`;
  el.innerHTML=html;
}

function renderPreviewSections(data){
  let html='';
  data.sections.forEach((sec,si)=>{
    const tc={main:'main',finish:'finish',core:'core',cardio:'cardio'}[sec.type]||'main';
    const total=sec.type==='cardio'?1:(sec.exercises?sec.exercises.reduce((t,ex)=>t+parseSets(ex),0):0);
    const pips=total>0?`<div class="section-progress">${Array.from({length:total},()=>'<div class="section-pip"></div>').join('')}</div>`:'';
    html+=`<div class="section"><div class="section-header"><div class="section-label ${tc}">${sec.label}</div>${pips}</div>`;
    if(sec.type==='cardio'){
      html+=`<div class="exercise-item locked" style="opacity:0.45;pointer-events:none;"><div class="exercise-main-row"><div class="exercise-text">${sec.cardioText}</div><div class="set-counter"><div class="set-dot"></div></div></div><div class="set-bar" style="--pct:0%"></div></div>`;
    } else {
      sec.exercises.forEach(ex=>{html+=`<div class="exercise-item locked" style="opacity:0.45;pointer-events:none;"><div class="exercise-main-row"><div class="exercise-text">${ex}</div></div><div class="set-bar" style="--pct:0%"></div></div>`;});
      if(sec.rest)html+=`<div class="rest-note">${sec.rest}</div>`;
    }
    html+=`</div>`;
  });
  return html;
}

function previewDay(){renderDaySelector();renderContentPreview();}
function startWorkout(){if(!isDayAccessible(currentDay))return;started[currentDay]=true;saveState();render();}

function tapSet(d,si,ei){
  if(isExerciseLocked(d,si,ei))return;
  const id=getExerciseId(d,si,ei),total=getTotalSets(d,si,ei),done=sets[id]||0;
  if(done>=total)return;
  sets[id]=done+1;saveState();render();checkCompletion();
  if(d===getCurrentDay())autoStartTimer(d,si,ei,sets[id]);
}

function tapCardio(d,si){
  if(!orderUnlocked[d]&&getNextExerciseId(d)!==null)return;
  const cid=`cardio-${d}-${si}`;sets[cid]=sets[cid]?0:1;resetTimer();saveState();render();
  if(sets[cid])checkCompletion();
}

function toggleOrderLock(){
  const btn=document.querySelector('.order-lock-btn');if(!btn)return;
  if(orderUnlocked[currentDay]){orderUnlocked[currentDay]=false;saveState();render();return;}
  if(btn.dataset.confirming==='true'){orderUnlocked[currentDay]=true;saveState();render();}
  else{btn.textContent='Tap again to unlock exercise order';btn.dataset.confirming='true';btn.style.color='var(--red)';btn.style.borderColor='var(--red)';setTimeout(()=>{if(btn?.dataset.confirming==='true'){btn.textContent='🔒 Lock Exercise Order';btn.dataset.confirming='false';btn.style.color='';btn.style.borderColor='';}},3000);}
}

function resetDay(){
  const btn=document.getElementById('resetDayBtn');if(!btn)return;
  if(btn.dataset.confirming==='true'){
    const data=workout[currentDay];
    if(data?.sections)data.sections.forEach((sec,si)=>{if(sec.type==='cardio')delete sets[`cardio-${currentDay}-${si}`];else if(sec.exercises)sec.exercises.forEach((_,ei)=>delete sets[getExerciseId(currentDay,si,ei)]);});
    delete started[currentDay];delete orderUnlocked[currentDay];saveState();render();
  } else {
    btn.textContent='Tap again to confirm reset';btn.dataset.confirming='true';btn.style.color='var(--red)';btn.style.borderColor='var(--red)';
    setTimeout(()=>{if(btn?.dataset.confirming==='true'){btn.textContent=`Reset ${currentDay}`;btn.dataset.confirming='false';btn.style.color='';btn.style.borderColor='';}},3000);
  }
}

function checkCompletion(){
  if(!isDayComplete(currentDay))return;
  const msgs=["You crushed it. Rest up and come back stronger.","Every rep counts. Great work today.","Done and dusted. Recovery starts now.","That's a full session. Well earned."];
  document.getElementById('completionSub').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('completionOverlay').classList.add('visible');
}

function closeCompletion(){
  document.getElementById('completionOverlay').classList.remove('visible');
  resetTimer();render();
}


// EDIT WORKOUT PLAN
function handleEditPlanTap(){
  if(editMode||isAnyWorkoutInProgress())return;
  const btn=document.getElementById('editPlanBtn');
  if(btn.dataset.confirming==='true'){
    btn.textContent='Edit Workout Plan';btn.dataset.confirming='false';btn.style.color='';btn.style.borderColor='';
    enterEditMode();
  } else {
    btn.textContent='Tap again to confirm';btn.dataset.confirming='true';btn.style.color='#D4820A';btn.style.borderColor='#D4820A';
    setTimeout(()=>{if(btn&&btn.dataset.confirming==='true'){btn.textContent='Edit Workout Plan';btn.dataset.confirming='false';btn.style.color='';btn.style.borderColor='';}},3000);
  }
}

function refreshEditButtonState(){
  const btn=document.getElementById('editPlanBtn');if(!btn)return;
  if(editMode||isAnyWorkoutInProgress()){btn.classList.add('disabled');}else{btn.classList.remove('disabled');}
}

function enterEditMode(){
  editMode=true;
  editDay=currentDay;
  editWorkoutDraft=JSON.parse(JSON.stringify(workout));
  editDirty=false;
  document.getElementById('daySelector').style.display='none';
  document.querySelector('.timer-bar').style.display='none';
  refreshEditButtonState();
  renderEditScreen();
}

function exitEditMode(){
  editMode=false;editDay=null;editWorkoutDraft=null;editDirty=false;
  document.getElementById('daySelector').style.display='';
  document.querySelector('.timer-bar').style.display='';
  render();
}

function handleEditCancel(){
  const btn=document.getElementById('editCancelBtn');if(!btn)return;
  if(btn.dataset.confirming==='true'){
    exitEditMode();
  } else {
    btn.textContent='Tap again to discard changes';
    btn.dataset.confirming='true';
    setTimeout(()=>{if(btn&&btn.dataset.confirming==='true'){btn.textContent='Cancel';btn.dataset.confirming='false';}},3000);
  }
}

function switchEditDay(newDay){
  if(editDirty){
    pendingEditDaySwitch=newDay;
    document.getElementById('savePromptOverlay').classList.add('visible');
    return;
  }
  editDay=newDay;
  renderEditScreen();
}

function cancelDaySwitch(){
  pendingEditDaySwitch=null;
  document.getElementById('savePromptOverlay').classList.remove('visible');
}

function confirmDaySwitch(){
  saveEditDay();
  document.getElementById('savePromptOverlay').classList.remove('visible');
  if(pendingEditDaySwitch){editDay=pendingEditDaySwitch;pendingEditDaySwitch=null;}
  renderEditScreen();
}

function saveEditDay(){
  workout=JSON.parse(JSON.stringify(editWorkoutDraft));
  localStorage.setItem('wt_workout',JSON.stringify(workout));
  editDirty=false;
}

function markEditDirty(){editDirty=true;}

function updateExerciseLine(si,ei,value){
  editWorkoutDraft[editDay].sections[si].exercises[ei]=value;
  markEditDirty();
}

function updateCardioText(si,value){
  editWorkoutDraft[editDay].sections[si].cardioText=value;
  markEditDirty();
}

function addExercise(si){
  editWorkoutDraft[editDay].sections[si].exercises.push('New Exercise — 3x10');
  markEditDirty();
  renderEditScreen();
}

function removeExercise(si,ei){
  editWorkoutDraft[editDay].sections[si].exercises.splice(ei,1);
  markEditDirty();
  renderEditScreen();
}

function renderEditScreen(){
  const el=document.getElementById('content');
  const data=editWorkoutDraft[editDay];
  const p=data.title.split(' — ');

  let html=`<div class="day-header"><div class="day-title">Edit: ${p[0]}</div><div class="day-subtitle">${p.slice(1).join(' — ')||'Ride Day'}</div></div>`;

  html+=`<div class="edit-day-selector">`;
  DAYS.forEach(d=>{
    const isSel=d===editDay;
    html+=`<button class="day-pill${isSel?' today':''}" onclick="switchEditDay('${d}')">${d.slice(0,3)}</button>`;
  });
  html+=`</div>`;

  data.sections.forEach((sec,si)=>{
    const tc={main:'main',finish:'finish',core:'core',cardio:'cardio'}[sec.type]||'main';
    html+=`<div class="edit-section"><div class="edit-section-label ${tc}">${sec.label}</div>`;
    if(sec.type==='cardio'){
      html+=`<div class="edit-cardio-row"><input class="edit-input" value="${(sec.cardioText||'').replace(/"/g,'&quot;')}" oninput="updateCardioText(${si},this.value)"></div>`;
    } else {
      sec.exercises.forEach((ex,ei)=>{
        html+=`<div class="edit-exercise-row">
          <input class="edit-input" value="${ex.replace(/"/g,'&quot;')}" placeholder="e.g. Floor Press — 4x12-15 @ 50 lbs" oninput="updateExerciseLine(${si},${ei},this.value)">
          <button class="edit-remove-btn" onclick="removeExercise(${si},${ei})">×</button>
        </div>`;
      });
      html+=`<button class="edit-add-btn" onclick="addExercise(${si})">+ Add Exercise</button>`;
    }
    html+=`</div>`;
  });

  html+=`<div class="edit-footer">
    <button class="edit-save-btn" onclick="saveEditDay();exitEditMode();">Save</button>
    <button class="edit-cancel-btn" id="editCancelBtn" onclick="handleEditCancel()">Cancel</button>
  </div>`;

  el.innerHTML=html;
}

// TIMER
let timerInterval=null,timerSeconds=0,timerTarget=0,timerRunning=false;
function setAndStart(s){clearInterval(timerInterval);timerRunning=false;timerTarget=s;timerSeconds=s;updateTimerDisplay();startTimer();}
function toggleTimer(){if(timerRunning)pauseTimer();else startTimer();}
function startTimer(){
  if(timerRunning||timerSeconds<=0)return;
  timerRunning=true;setPlayPauseText('Pause');updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timerSeconds--;updateTimerDisplay();
    if(timerSeconds<=0){
      clearInterval(timerInterval);timerRunning=false;timerSeconds=0;timerTarget=0;
      setPlayPauseText('Play');
      const d=document.getElementById('timerDisplay');if(d){d.textContent='0:00';d.className='timer-display';}
      triggerFlash();playTimerSound();
    }
  },1000);
}
function pauseTimer(){if(!timerRunning)return;clearInterval(timerInterval);timerRunning=false;setPlayPauseText('Play');updateTimerDisplay();}
function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerSeconds=0;timerTarget=0;setPlayPauseText('Play');const d=document.getElementById('timerDisplay');if(d){d.textContent='0:00';d.className='timer-display';}}
function setPlayPauseText(t){const b=document.getElementById('playPauseBtn');if(b)b.textContent=t;}
function updateTimerDisplay(){const m=Math.floor(Math.abs(timerSeconds)/60),s=Math.abs(timerSeconds)%60;const d=document.getElementById('timerDisplay');if(!d)return;d.textContent=`${m}:${s.toString().padStart(2,'0')}`;d.className=timerRunning?'timer-display running':'timer-display';}
function triggerFlash(){const el=document.getElementById('timerFlash');if(!el)return;el.style.display='block';el.style.animation='none';el.offsetHeight;el.style.animation='flashFade 0.4s ease-out forwards';setTimeout(()=>{el.style.display='none';},420);}

// AUDIO
let audioCtx=null;
function ensureAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
document.addEventListener('touchstart',()=>ensureAudioCtx(),{passive:true});
document.addEventListener('click',()=>ensureAudioCtx(),{passive:true});
function playTimerSound(){
  try{const ctx=ensureAudioCtx();[[880,0,0.12],[880,0.16,0.12],[1100,0.32,0.28]].forEach(([freq,start,dur])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,ctx.currentTime+start);g.gain.linearRampToValueAtTime(1.0,ctx.currentTime+start+0.01);g.gain.linearRampToValueAtTime(0,ctx.currentTime+start+dur);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+0.05);});}catch(e){}
}


(function init(){
  const cw=getWeekKey(),sw=localStorage.getItem('wt_week');
  if(sw&&sw!==cw)Object.keys(localStorage).forEach(k=>{if(k.startsWith('wt_state_'))localStorage.removeItem(k);});
  localStorage.setItem('wt_week',cw);
  const today=todayKey();Object.keys(localStorage).forEach(k=>{if(k.startsWith('wt_state_')&&!k.endsWith(today))localStorage.removeItem(k);});
  loadState();render();refreshEditButtonState();
  setTimeout(()=>{const sel=document.getElementById('daySelector'),idx=DAYS.indexOf(currentDay);if(sel?.children[idx])sel.children[idx].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});},100);
})();
</script>
