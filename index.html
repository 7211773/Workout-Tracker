<!DOCTYPE html>  
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fitness Is My Passion</title>
<style>
  :root {
    --red:    #C0392B;
    --amber:  #D4820A;
    --purple: #7D3C98;
    --blue:   #2471A3;
    --green:  #1E8449;
    --light:  #888;
    --bg:     #0E0E0E;
    --card:   #181818;
    --border: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: #E8E8E8;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 20px);
    min-height: 100dvh;
  }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,14,14,0.95);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .app-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--light); text-transform: uppercase;
  }
  .header-actions { display: flex; gap: 5px; }
  .btn-upload {
    background: #1C1C1E; border: 1px solid var(--border);
    color: var(--light); font-size: 11px;
    padding: 5px 9px; border-radius: 20px; cursor: pointer;
  }

  /* ── DAY SELECTOR ── */
  .day-selector {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
    margin-bottom: 4px;
  }
  .day-pill {
    padding: 8px 2px; border-radius: 20px; text-align: center; width: 100%;
    border: 1px solid #444; background: #1C1C1E;
    color: #C8C8C8; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .day-pill.today          { background: var(--green);  border-color: var(--green);  color: #fff; }
  .day-pill.selected-other { background: var(--red);    border-color: var(--red);    color: #fff; opacity: 0.35; }
  .day-pill.complete       { border-color: #2A4A2A; color: var(--green); }
  .day-pill.future-locked  { opacity: 0.35; cursor: pointer; }
  .day-pill.past-locked    { opacity: 0.35; cursor: pointer; }

  /* ── TIMER ── */
  .timer-bar {
    margin: 12px 0 0; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; display: flex; align-items: center; gap: 8px;
  }
  .timer-display {
    font-size: 26px; font-weight: 300; color: #fff;
    font-variant-numeric: tabular-nums; min-width: 56px; letter-spacing: 0.02em;
  }
  .timer-display.running { color: var(--amber); }
  .timer-presets { display: flex; gap: 6px; flex: 1; }
  .preset-btn {
    flex-shrink: 0; width: 70px; padding: 7px 0; border-radius: 20px; text-align: center;
    border: 1px solid var(--border); background: transparent;
    color: #E8E8E8; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .preset-btn:active { background: #2A2A2A; }
  .timer-controls { display: flex; gap: 6px; }
  .ctrl-btn {
    flex-shrink: 0; width: 70px; padding: 7px 0; border-radius: 20px;
    border: none; cursor: pointer; text-align: center;
    font-size: 13px; font-weight: 600; color: #fff;
    transition: opacity 0.15s;
  }
  .ctrl-btn:active { opacity: 0.8; }
  .ctrl-play  { background: var(--green); }
  .ctrl-reset { background: var(--red); }

  /* ── CONTENT ── */
  .content { padding: 0 10px 40px; }

  /* ── START SCREEN ── */
  .start-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
    min-height: 60vh; padding: 24px;
  }
  .start-day-title { font-size: 22px; font-weight: 700; color: var(--red); margin-bottom: 6px; }
  .start-day-sub   { font-size: 14px; color: var(--light); margin-bottom: 32px; line-height: 1.5; }
  .start-btn {
    background: var(--green); color: #fff;
    font-size: 17px; font-weight: 700;
    padding: 16px 48px; border-radius: 14px;
    border: none; cursor: pointer;
    box-shadow: 0 4px 20px rgba(30,132,73,0.35);
  }
  .start-btn:active { opacity: 0.85; }

  /* ── DAY HEADER ── */
  .day-header { padding: 8px 4px 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .day-title   { font-size: 19px; font-weight: 700; color: var(--red); letter-spacing: -0.01em; }
  .day-subtitle { font-size: 12px; color: var(--light); margin-top: 2px; }

  /* ── PROGRESS ── */
  .overall-progress { margin-top: 8px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--light); margin-bottom: 4px;
  }
  .progress-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s ease; }

  /* ── SECTION ── */
  .section { margin-bottom: 16px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  .section-label { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; padding: 4px 0; }
  .section-label.main   { color: var(--amber);  }
  .section-label.finish { color: var(--purple); }
  .section-label.core   { color: var(--blue);   }
  .section-label.cardio { color: var(--green);  }
  .section-progress { display: flex; align-items: center; gap: 4px; }
  .section-pip { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
  .section-pip.done { background: var(--green); }

  /* ── EXERCISE ITEM ── */
  .exercise-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 6px; overflow: hidden;
  }
  .exercise-item.locked   { opacity: 0.4; pointer-events: none; }
  .exercise-item.all-done { opacity: 0.5; }
  .exercise-main-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .exercise-main-row:active { background: #222; }
  .exercise-text { font-size: 14px; color: #D8D8D8; line-height: 1.4; flex: 1; }
  .exercise-item.all-done .exercise-text { text-decoration: line-through; color: var(--light); }
  .set-counter { display: flex; align-items: center; gap: 3px; flex-shrink: 0; margin-top: 2px; }
  .set-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.15s; flex-shrink: 0; }
  .set-dot.done      { background: var(--green); }
  .set-dot.last-done { background: var(--amber); }
  .set-bar {
    height: 2px;
    background: linear-gradient(to right, var(--green) var(--pct, 0%), var(--border) var(--pct, 0%));
  }

  /* ── REST NOTE ── */
  .rest-note { font-size: 12px; color: var(--light); font-style: italic; padding: 4px 4px 8px; }

  /* ── LOCKED / DONE MESSAGE ── */
  .day-locked-msg {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 20px; padding: 14px;
    background: transparent; border: 1px solid #2A4A2A;
    border-radius: 10px; color: var(--green);
    font-size: 14px; font-weight: 500;
  }

  /* ── ORDER LOCK BUTTON ── */
  .order-lock-btn {
    display: block; width: 100%; margin-top: 12px; padding: 12px;
    background: transparent; border: 1px solid #7D5A00;
    color: var(--amber); border-radius: 10px;
    font-size: 14px; cursor: pointer; text-align: center;
  }
  .order-lock-btn.unlocked { color: var(--green); border-color: #2A4A2A; }
  .order-lock-btn:active { background: #1C1C1E; }

  /* ── RESET BUTTON ── */
  .reset-day-btn {
    display: block; width: 100%; margin-top: 12px; padding: 12px;
    background: transparent; border: 1px solid var(--border);
    color: var(--light); border-radius: 10px;
    font-size: 14px; cursor: pointer; text-align: center;
  }
  .reset-day-btn:active { background: #1C1C1E; }

  /* ── COMPLETION OVERLAY ── */
  .completion-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); padding: 32px; text-align: center;
  }
  .completion-overlay.visible { display: flex; }
  .completion-card {
    background: #1C1C1E; border: 1px solid var(--border);
    border-radius: 24px; padding: 36px 28px; width: 100%; max-width: 340px;
  }
  .completion-emoji { font-size: 56px; margin-bottom: 12px; }
  .completion-title { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; letter-spacing: -0.02em; }
  .completion-sub   { font-size: 15px; color: var(--light); margin-bottom: 28px; line-height: 1.5; }
  .completion-close {
    background: var(--green); color: #fff;
    font-size: 16px; font-weight: 700;
    padding: 14px 32px; border-radius: 12px;
    border: none; cursor: pointer; width: 100%;
  }
  .completion-close:active { opacity: 0.85; }

  /* ── UPLOAD OVERLAY ── */
  .upload-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .upload-overlay.visible { display: flex; }
  .upload-card {
    background: #1C1C1E; border: 1px solid var(--border);
    border-radius: 18px; padding: 28px 24px; width: 100%; max-width: 360px; text-align: center;
  }
  .upload-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .upload-card p  { font-size: 13px; color: var(--light); margin-bottom: 20px; line-height: 1.6; }
  .upload-drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px 16px; margin-bottom: 16px; cursor: pointer; transition: border-color 0.2s;
  }
  .upload-drop:hover { border-color: var(--amber); }
  .upload-drop-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-drop-text { font-size: 13px; color: var(--light); }
  #pdfFileInput { display: none; }
  .upload-close {
    background: transparent; border: 1px solid var(--border); color: var(--light);
    padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%;
  }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--light); }
  .empty-state h2 { font-size: 18px; color: #E8E8E8; margin-bottom: 8px; }
  .empty-state p  { font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  .btn-primary {
    display: inline-block; background: var(--red); color: #fff;
    padding: 11px 24px; border-radius: 10px; font-size: 15px;
    font-weight: 600; border: none; cursor: pointer;
  }
</style>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <span class="app-title">Fitness Is My Passion</span>
    <div class="header-actions">
<button class="btn-upload" onclick="viewPDF()" id="viewPdfBtn" style="display:none;">View PDF</button>
      <button class="btn-upload" onclick="showUpload()">Upload PDF</button>
    </div>
  </div>
  <div class="day-selector" id="daySelector"></div>
  <div class="timer-bar">
    <div class="timer-display" id="timerDisplay">0:00</div>
    <div class="timer-presets">
      <button class="preset-btn" onclick="setAndStart(30)">30s</button>
      <button class="preset-btn" onclick="setAndStart(120)">2m</button>
    </div>
    <div class="timer-controls">
      <button class="ctrl-btn ctrl-play"  id="playPauseBtn" onclick="toggleTimer()">Play</button>
      <button class="ctrl-btn ctrl-reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content" id="content"></div>

<!-- COMPLETION OVERLAY -->
<div class="completion-overlay" id="completionOverlay">
  <div class="completion-card">
    <div class="completion-emoji">🔥</div>
    <div class="completion-title">Workout Complete!</div>
    <div class="completion-sub" id="completionSub"></div>
    <button class="completion-close" onclick="closeCompletion()">Done</button>
  </div>
</div>

<!-- UPLOAD OVERLAY -->
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-card">
    <h2>Upload Workout Plan</h2>
    <p>Upload your Weekly Workout Plan PDF. The app reads your exercises and builds your tracker automatically.</p>
    <div class="upload-drop" onclick="document.getElementById('pdfFileInput').click()">
      <div class="upload-drop-icon">📄</div>
      <div class="upload-drop-text">Tap to choose your PDF</div>
    </div>
    <input type="file" id="pdfFileInput" accept="application/pdf" onchange="handlePDFUpload(event)">
    <button class="upload-close" onclick="hideUpload()">Cancel</button>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════
// WORKOUT DATA
// ══════════════════════════════════════════════════
const HARDCODED = {
  Monday: { title:'Monday — Heavy Chest + Back', type:'workout', sections:[
    { label:'🥵 Main Work', type:'main', rest:'Rest 2 minutes between sets', exercises:[
      'Floor Press — 4x12-15 @ 50 lbs',
      'Neutral Grip Floor Press — 4x12-15 @ 40 lbs',
      'One-Arm Row — 4x12-15 @ 40 lbs',
      'Feet Elevated Push-Ups — 4x12–15',
    ]},
    { label:'🔥 Finisher', type:'finish', rest:'Rest 30 seconds between sets', exercises:[
      'DB Pullover — 4x10 @ 30 lbs',
      'Push-Ups — 4x10',
    ]},
    { label:'💀 Core Finisher', type:'core', rest:'Rest 30 seconds between sets', exercises:[
      'Dead Bug — 3x8 each side (slow, controlled)',
      'Dead Bug with Contralateral Hold — 3x8 each side (hold 2-3 sec at full extension)',
    ]},
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Free Ride — 20 min' },
  ]},
  Tuesday: { title:'Tuesday — Chest + Back (Volume & Stretch)', type:'workout', sections:[
    { label:'🥵 Main Work', type:'main', rest:'Rest 2 minutes between sets', exercises:[
      'Deficit Push-Ups — 4x12-15',
      'DB Floor Fly — 4x12–15 @ 35 lbs',
      'Feet Elevated Push-Ups — 4x12–15',
      'Bent-Over Rows — 4x12–15 @ 35 lbs',
    ]},
    { label:'🔥 Finisher', type:'finish', rest:'Rest 30 seconds between sets', exercises:[
      'DB Pullover — 4x8 @ 35 lbs',
      'Rear Delt Fly — 4x8 @ 15 lbs',
    ]},
    { label:'💀 Core Finisher', type:'core', rest:'Rest 30 seconds between sets', exercises:[
      'Windshield Wiper — 3x14 (slow, controlled)',
      'Tabletop Tuck Up — 3x12 (slow, controlled)',
    ]},
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Free Ride — 20 min' },
  ]},
  Wednesday: { title:'Wednesday — Shoulders + Arms (Hypertrophy)', type:'workout', sections:[
    { label:'🥵 Main Work', type:'main', rest:'Rest 2 minutes between sets', exercises:[
      'Shoulder Press — 4x12–15 @ 25 lbs',
      'Lateral Raises — 4x12–15 @ 15 lbs',
      'Rear Delt Fly — 3x12–15 @ 15 lbs',
      'DB Curl — 4x10–12 @ 25 lbs',
      'Overhead Tricep Extension — 4x10–12 @ 25 lbs (1 DB)',
    ]},
    { label:'🔥 Finisher', type:'finish', rest:'Rest 30 seconds between sets', exercises:[
      'DB Thrusters — 3x10 @ 15 lbs',
      'Rear Delt Fly — 3x12 @ 15 lbs',
    ]},
    { label:'💀 Core Finisher', type:'core', rest:'Rest 30 seconds between sets', exercises:[
      'DB Vertical Leg Crunch — 3x12 @ 20 lbs (1 DB)',
      'Lying Leg Raise — 3x12 (arms flat, lower back down, crunch up)',
    ]},
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Planned Class — 20 min' },
  ]},
  Thursday: { title:'Thursday — Shoulders + Arms (Strength)', type:'workout', sections:[
    { label:'🥵 Main Work', type:'main', rest:'Rest 2 minutes between sets', exercises:[
      'Heavy Shoulder Press — 4x10-12 @ 30 lbs',
      'Lateral Raises — 4x10–12 @ 20 lbs',
      'Rear Delt Fly — 3x10–12 @ 20 lbs',
      'Heavy Alternating Curl — 4x10-12 @ 30 lbs',
      'Close-Grip Floor Press — 4x10–12 @ 30 lbs',
    ]},
    { label:'🔥 Finisher', type:'finish', rest:'Rest 30 seconds between sets', exercises:[
      'Tricep Kickbacks — 3x12 @ 20 lbs',
      'Hammer Curl — 3x10 @ 30 lbs',
    ]},
    { label:'💀 Core Finisher', type:'core', rest:'Rest 30 seconds between sets', exercises:[
      'Vertical Leg Crunch — 3x12',
      'Dead Bug — 3x12 each side (slow, controlled)',
    ]},
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Planned Class — 20 min' },
  ]},
  Friday: { title:'Friday — Chest + Back (Pump)', type:'workout', sections:[
    { label:'🥵 Main Work', type:'main', rest:'Rest 2 minutes between sets', exercises:[
      'High-Rep DB Squeeze Press — 4x15-18 @ 35 lbs',
      'High-Rep Rear Delt Fly — 4x15-18 @ 15 lbs',
      'Renegade Row — 3x10 each side @ 35 lbs',
      'Feet Elevated Push-Ups — 4x15-18',
      'High-Rep Bent-Over Rows — 4x15-18 @ 35 lbs',
    ]},
    { label:'🔥 Finisher', type:'finish', rest:'Rest 30 seconds between sets', exercises:[
      'Close-Grip Push-Ups — 3x10-12',
      'DB Sumo Squat — 3x10 @ 20 lbs (1 DB)',
    ]},
    { label:'💀 Core Finisher', type:'core', rest:'Rest 30 seconds between sets', exercises:[
      'Tabletop Tuck Up — 3x15 (slow, controlled)',
      'Mountain Climbers — 3x40 total reps',
    ]},
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Free Ride — 20 min' },
  ]},
  Saturday: { title:'Saturday — Ride Day', type:'workout', sections:[
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Planned Ride — 45 min' },
  ]},
  Sunday: { title:'Sunday — Ride Day', type:'workout', sections:[
    { label:'🚴 Cardio', type:'cardio', cardioText:'Peloton Planned Ride — 45 min' },
  ]},
};

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let workout       = loadWorkout();
let currentDay    = getCurrentDay();
let sets          = {};
let started       = {};
let orderUnlocked = {};

function todayKey()  { return new Date().toISOString().slice(0,10); }

function getWeekKey() {
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${week}`;
}

function getCurrentDay() {
  const map = [6,0,1,2,3,4,5];
  return DAYS[map[new Date().getDay()]];
}

function getDayIndex(day)     { return DAYS.indexOf(day); }
function getCurrentDayIndex() { return getDayIndex(getCurrentDay()); }
function isDayAccessible(day) { return day === getCurrentDay(); }
function isDayFuture(day)     { return getDayIndex(day) > getCurrentDayIndex(); }
function isDayPast(day)       { return getDayIndex(day) < getCurrentDayIndex(); }

function loadWorkout() {
  try { const s = localStorage.getItem('wt_workout'); if (s) return JSON.parse(s); } catch(e) {}
  return JSON.parse(JSON.stringify(HARDCODED));
}

function loadState() {
  const key = 'wt_state_' + todayKey();
  try {
    const s = localStorage.getItem(key);
    if (s) { const d = JSON.parse(s); sets = d.sets||{}; started = d.started||{}; orderUnlocked = d.orderUnlocked||{}; return; }
  } catch(e) {}
  sets = {}; started = {}; orderUnlocked = {};
}

function saveState() {
  localStorage.setItem('wt_state_' + todayKey(), JSON.stringify({ sets, started, orderUnlocked }));
}

// ══════════════════════════════════════════════════
// SET COUNTING
// ══════════════════════════════════════════════════
function parseSets(text) {
  const m = text.match(/(\d+)x\d+/);
  return m ? parseInt(m[1]) : 1;
}

function getExerciseId(day, si, ei) { return `${day}-${si}-${ei}`; }
function getTotalSets(day, si, ei)  { return parseSets(workout[day].sections[si].exercises[ei]); }
function getSetsForExercise(day, si, ei) { return sets[getExerciseId(day, si, ei)] || 0; }
function isExerciseDone(day, si, ei) { return getSetsForExercise(day, si, ei) >= getTotalSets(day, si, ei); }

function isSectionDone(day, si) {
  const sec = workout[day].sections[si];
  return !sec.exercises || sec.exercises.every((_, ei) => isExerciseDone(day, si, ei));
}

function isDayComplete(day) {
  const data = workout[day];
  if (!data || data.type !== 'workout') return false;
  if (!started[day]) return false;
  return data.sections.every((sec, si) => {
    if (sec.type === 'cardio') return !!sets[`cardio-${day}-${si}`];
    return !sec.exercises || isSectionDone(day, si);
  });
}

function getDayProgress(day) {
  const data = workout[day];
  if (!data || !data.sections) return { done:0, total:0 };
  let done = 0, total = 0;
  data.sections.forEach((sec, si) => {
    if (sec.type === 'cardio') {
      total += 1; done += sets[`cardio-${day}-${si}`] ? 1 : 0;
    } else if (sec.exercises) {
      sec.exercises.forEach((_, ei) => {
        total += getTotalSets(day, si, ei);
        done  += Math.min(getSetsForExercise(day, si, ei), getTotalSets(day, si, ei));
      });
    }
  });
  return { done, total };
}

function getSectionProgress(day, si) {
  const sec = workout[day].sections[si];
  if (sec.type === 'cardio') return { done: sets[`cardio-${day}-${si}`] ? 1 : 0, total: 1 };
  if (!sec.exercises) return { done:0, total:0 };
  let done = 0, total = 0;
  sec.exercises.forEach((_, ei) => {
    total += getTotalSets(day, si, ei);
    done  += Math.min(getSetsForExercise(day, si, ei), getTotalSets(day, si, ei));
  });
  return { done, total };
}

// ══════════════════════════════════════════════════
// EXERCISE ORDER LOCKING
// ══════════════════════════════════════════════════
function getNextExerciseId(day) {
  const data = workout[day];
  if (!data || !data.sections) return null;
  for (let si = 0; si < data.sections.length; si++) {
    const sec = data.sections[si];
    if (!sec.exercises) continue;
    for (let ei = 0; ei < sec.exercises.length; ei++) {
      if (!isExerciseDone(day, si, ei)) return getExerciseId(day, si, ei);
    }
  }
  return null;
}

function isExerciseLocked(day, si, ei) {
  if (orderUnlocked[day]) return false;
  if (!isDayAccessible(day)) return true;
  return getExerciseId(day, si, ei) !== getNextExerciseId(day);
}

// ══════════════════════════════════════════════════
// AUTO TIMER
// ══════════════════════════════════════════════════
function autoStartTimer(day, si, ei, newDoneCount) {
  const data = workout[day];
  if (!data || !data.sections) return;
  const sec = data.sections[si];
  if (!sec || !sec.exercises) return;

  const totalSets = getTotalSets(day, si, ei);
  const isLastSet = newDoneCount >= totalSets;

  // Find the last section with exercises and its last exercise
  const lastExSi = data.sections.reduce((last, s, idx) =>
    (s.exercises && s.exercises.length > 0) ? idx : last, -1);
  const lastExEi = lastExSi >= 0 ? data.sections[lastExSi].exercises.length - 1 : -1;

  // Final set of final exercise — stop any running timer and don't start a new one
  if (si === lastExSi && ei === lastExEi && isLastSet) {
    resetTimer();
    return;
  }

  const durations = { main:120, finish:30, core:30 };
  const secs = durations[sec.type];
  if (secs) setAndStart(secs);
}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════
function render() {
  renderDaySelector();
  renderContent();
}

function renderDaySelector() {
  const sel = document.getElementById('daySelector');
  sel.innerHTML = '';
  const todayDay = getCurrentDay();
  DAYS.forEach(day => {
    const isSelected = day === currentDay;
    const isToday    = day === todayDay;
    const isDone     = isDayComplete(day);
    const future     = isDayFuture(day);
    const past       = isDayPast(day);
    const btn = document.createElement('button');
    let cls = 'day-pill';
    if (isSelected && isToday)       cls += ' today';
    else if (isSelected && !isToday) cls += ' selected-other';
    else if (isToday)                cls += ' today';
    if (isDone)                      cls += ' complete';
    if (future)                      cls += ' future-locked';
    if (past && !isSelected)         cls += ' past-locked';
    btn.className = cls;
    btn.textContent = day.slice(0,3);
    btn.onclick = future
      ? () => { currentDay = day; renderDaySelector(); renderContentPreview(); }
      : () => { currentDay = day; render(); };
    sel.appendChild(btn);
  });
}

function renderContent() {
  const el   = document.getElementById('content');
  const data = workout[currentDay];

  if (!data) {
    el.innerHTML = `<div class="empty-state"><h2>No workout loaded</h2><p>Upload your PDF to get started.</p><button class="btn-primary" onclick="showUpload()">Upload PDF</button></div>`;
    return;
  }

  const isStarted = !!started[currentDay];
  const isDone    = isDayComplete(currentDay);
  const past      = isDayPast(currentDay);
  const accessible = isDayAccessible(currentDay);

  if (!isStarted) {
    if (past) { renderContentPastDay(currentDay); return; }
    const parts = data.title.split(' — ');
    el.innerHTML = `
      <div class="start-screen">
        <div class="start-day-title">${parts[0]}</div>
        <div class="start-day-sub">${parts.slice(1).join(' — ')}</div>
        ${accessible
          ? `<button class="start-btn" onclick="startWorkout()">Start Workout</button>`
          : `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
              <div class="day-locked-msg" style="margin-top:0;border-color:#2A2A2A;color:var(--light);">🔒 Not yet — come back ${parts[0]}</div>
              <button class="reset-day-btn" style="margin-top:0;border-color:#2A2A2A;color:var(--light);width:auto;padding:10px 28px;" onclick="previewDay()">View Workout</button>
             </div>`
        }
      </div>`;
    return;
  }

  const parts = data.title.split(' — ');
  const prog  = getDayProgress(currentDay);
  const pct   = prog.total ? Math.round((prog.done / prog.total) * 100) : 0;

  let html = `
    <div class="day-header">
      <div class="day-title">${parts[0]}</div>
      <div class="day-subtitle">${parts.slice(1).join(' — ')}</div>
      ${isDone
        ? `<div class="day-locked-msg" style="margin-top:8px;border-color:#2A4A2A;color:var(--green);">✓ ${parts[0]} complete</div>`
        : `<div class="overall-progress">
            <div class="progress-label"><span>Overall</span><span>${prog.done}/${prog.total} sets</span></div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
           </div>`
      }
    </div>`;

  data.sections.forEach((sec, si) => {
    const typeClass = {main:'main',finish:'finish',core:'core',cardio:'cardio'}[sec.type] || 'main';
    const secProg   = (sec.exercises || sec.type === 'cardio') ? getSectionProgress(currentDay, si) : null;

    html += `<div class="section"><div class="section-header">
      <div class="section-label ${typeClass}">${sec.label}</div>`;
    if (secProg && secProg.total > 0) {
      html += `<div class="section-progress">` +
        Array.from({length: secProg.total}, (_,i) =>
          `<div class="section-pip${i < secProg.done ? ' done' : ''}"></div>`).join('') +
        `</div>`;
    }
    html += `</div>`;

    if (sec.type === 'cardio') {
      const cid = `cardio-${currentDay}-${si}`;
      const cdone = !!sets[cid];
      const cardioLocked = !orderUnlocked[currentDay] && getNextExerciseId(currentDay) !== null;
      html += `<div class="exercise-item${cdone ? ' all-done' : ''}${isDone || cardioLocked ? ' locked' : ''}"
        style="${cardioLocked ? 'opacity:0.35;' : ''}"
        onclick="tapCardio('${currentDay}',${si})">
        <div class="exercise-main-row" style="cursor:pointer;">
          <div class="exercise-text">${sec.cardioText}</div>
          <div class="set-counter"><div class="set-dot${cdone ? ' done' : ''}"></div></div>
        </div>
        <div class="set-bar" style="--pct:${cdone ? 100 : 0}%"></div>
      </div>`;
    } else {
      sec.exercises.forEach((ex, ei) => {
        const id       = getExerciseId(currentDay, si, ei);
        const total    = getTotalSets(currentDay, si, ei);
        const done     = getSetsForExercise(currentDay, si, ei);
        const allDone  = done >= total;
        const exLocked = isExerciseLocked(currentDay, si, ei);
        const pctFill  = Math.round((done / total) * 100);
        const dots = Array.from({length: total}, (_,i) => {
          let cls = 'set-dot';
          if (i < done) cls += i === done-1 ? ' last-done' : ' done';
          return `<div class="${cls}"></div>`;
        }).join('');
        html += `
          <div class="exercise-item${allDone ? ' all-done' : ''}${isDone || exLocked ? ' locked' : ''}"
            id="ex-${id}" style="${exLocked && !allDone ? 'opacity:0.35;' : ''}">
            <div class="exercise-main-row" onclick="tapSet('${currentDay}',${si},${ei})">
              <div class="exercise-text">${ex}</div>
              <div class="set-counter">${dots}</div>
            </div>
            <div class="set-bar" style="--pct:${pctFill}%"></div>
          </div>`;
      });
      if (sec.rest) html += `<div class="rest-note">${sec.rest}</div>`;
    }
    html += `</div>`;
  });

  if (accessible && !isDone) {
    const unlocked = !!orderUnlocked[currentDay];
    html += `<button class="order-lock-btn${unlocked ? ' unlocked' : ''}" onclick="toggleOrderLock()">
      ${unlocked ? '🔓 Exercise Order Unlocked' : '🔒 Lock Exercise Order'}
    </button>`;
  }
  html += `<button class="reset-day-btn" id="resetDayBtn" onclick="resetDay()"${isDone ? ' style="margin-top:8px;"' : ''}>Reset ${currentDay}</button>`;

  el.innerHTML = html;
}

function renderContentPastDay(day) {
  const el   = document.getElementById('content');
  const data = workout[day];
  const parts = data.title.split(' — ');
  let html = `
    <div class="day-header">
      <div class="day-title">${parts[0]}</div>
      <div class="day-subtitle">${parts.slice(1).join(' — ')}</div>
      <div class="day-locked-msg" style="margin-top:8px;">✓ ${parts[0]} complete</div>
    </div>`;
  html += renderPreviewSections(data);
  html += `<button class="reset-day-btn" onclick="currentDay=getCurrentDay();render();" style="border-color:#2A2A2A;color:var(--light);">← Back to today</button>`;
  el.innerHTML = html;
}

function renderContentPreview() {
  const el   = document.getElementById('content');
  const data = workout[currentDay];
  const parts = data.title.split(' — ');
  let html = `
    <div class="day-header">
      <div class="day-title">${parts[0]}</div>
      <div class="day-subtitle">${parts.slice(1).join(' — ')}</div>
      <div class="day-locked-msg" style="margin-top:8px;border-color:#7D5A00;color:var(--amber);">Preview only</div>
    </div>`;
  html += renderPreviewSections(data);
  html += `<button class="reset-day-btn" onclick="currentDay=getCurrentDay();render();" style="border-color:#2A2A2A;color:var(--light);">← Back to today</button>`;
  el.innerHTML = html;
}

function renderPreviewSections(data) {
  let html = '';
  data.sections.forEach((sec, si) => {
    const typeClass = {main:'main',finish:'finish',core:'core',cardio:'cardio'}[sec.type] || 'main';
    const total = sec.type === 'cardio' ? 1 : (sec.exercises ? sec.exercises.reduce((t,ex) => t + parseSets(ex), 0) : 0);
    const pips = total > 0
      ? `<div class="section-progress">${Array.from({length:total}, () => '<div class="section-pip"></div>').join('')}</div>`
      : '';
    html += `<div class="section"><div class="section-header"><div class="section-label ${typeClass}">${sec.label}</div>${pips}</div>`;
    if (sec.type === 'cardio') {
      html += `<div class="exercise-item locked" style="opacity:0.45;pointer-events:none;">
        <div class="exercise-main-row"><div class="exercise-text">${sec.cardioText}</div>
        <div class="set-counter"><div class="set-dot"></div></div></div>
        <div class="set-bar" style="--pct:0%"></div></div>`;
    } else {
      sec.exercises.forEach(ex => {
        html += `<div class="exercise-item locked" style="opacity:0.45;pointer-events:none;">
          <div class="exercise-main-row"><div class="exercise-text">${ex}</div></div>
          <div class="set-bar" style="--pct:0%"></div></div>`;
      });
      if (sec.rest) html += `<div class="rest-note">${sec.rest}</div>`;
    }
    html += `</div>`;
  });
  return html;
}

function previewDay() { renderDaySelector(); renderContentPreview(); }

// ══════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════
function startWorkout() {
  if (!isDayAccessible(currentDay)) return;
  started[currentDay] = true;
  saveState(); render();
}

function tapSet(day, si, ei) {
  if (isExerciseLocked(day, si, ei)) return;
  const id    = getExerciseId(day, si, ei);
  const total = getTotalSets(day, si, ei);
  const done  = sets[id] || 0;
  if (done >= total) return;
  sets[id] = done + 1;
  saveState(); render(); checkCompletion();
  if (day === getCurrentDay()) autoStartTimer(day, si, ei, sets[getExerciseId(day, si, ei)] || 0);
}

function tapCardio(day, si) {
  if (!orderUnlocked[day] && getNextExerciseId(day) !== null) return;
  const cid = `cardio-${day}-${si}`;
  sets[cid] = sets[cid] ? 0 : 1;
  resetTimer(); // no rest timer needed before or after cardio
  saveState(); render();
  if (sets[cid]) checkCompletion();
}

function toggleOrderLock() {
  const btn = document.querySelector('.order-lock-btn');
  if (!btn) return;

  // Locking doesn't need confirmation — only unlocking does
  if (orderUnlocked[currentDay]) {
    orderUnlocked[currentDay] = false;
    saveState(); render();
    return;
  }

  if (btn.dataset.confirming === 'true') {
    orderUnlocked[currentDay] = true;
    saveState(); render();
  } else {
    btn.textContent = 'Tap again to unlock exercise order';
    btn.dataset.confirming = 'true';
    btn.style.color = 'var(--red)';
    btn.style.borderColor = 'var(--red)';
    setTimeout(() => {
      if (btn && btn.dataset.confirming === 'true') {
        btn.textContent = '🔒 Lock Exercise Order';
        btn.dataset.confirming = 'false';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
    }, 3000);
  }
}

function resetDay() {
  const btn = document.getElementById('resetDayBtn');
  if (!btn) return;
  if (btn.dataset.confirming === 'true') {
    const data = workout[currentDay];
    if (data && data.sections) {
      data.sections.forEach((sec, si) => {
        if (sec.type === 'cardio') {
          delete sets[`cardio-${currentDay}-${si}`];
        } else if (sec.exercises) {
          sec.exercises.forEach((_, ei) => delete sets[getExerciseId(currentDay, si, ei)]);
        }
      });
    }
    delete started[currentDay];
    delete orderUnlocked[currentDay];
    saveState(); render();
  } else {
    btn.textContent = 'Tap again to confirm reset';
    btn.dataset.confirming = 'true';
    btn.style.color = 'var(--red)';
    btn.style.borderColor = 'var(--red)';
    setTimeout(() => {
      if (btn && btn.dataset.confirming === 'true') {
        btn.textContent = `Reset ${currentDay}`;
        btn.dataset.confirming = 'false';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
    }, 3000);
  }
}

// ══════════════════════════════════════════════════
// COMPLETION
// ══════════════════════════════════════════════════
function checkCompletion() {
  if (!isDayComplete(currentDay)) return;
  const msgs = [
    "You crushed it. Rest up and come back stronger.",
    "Every rep counts. Great work today.",
    "Done and dusted. Recovery starts now.",
    "That's a full session. Well earned.",
  ];
  document.getElementById('completionSub').textContent = msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('completionOverlay').classList.add('visible');
}

function closeCompletion() {
  document.getElementById('completionOverlay').classList.remove('visible');
  resetTimer();
}

// ══════════════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════════════
let timerInterval = null;
let timerSeconds  = 0;
let timerTarget   = 0;
let timerRunning  = false;

function setAndStart(secs) {
  clearInterval(timerInterval);
  timerRunning = false;
  timerTarget  = secs;
  timerSeconds = secs;
  updateTimerDisplay();
  startTimer();
}

function toggleTimer() { if (timerRunning) pauseTimer(); else startTimer(); }

function startTimer() {
  if (timerRunning || timerSeconds <= 0) return;
  timerRunning = true;
  setPlayPauseText('Pause');
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 0;
      timerTarget  = 0;
      setPlayPauseText('Play');
      const d = document.getElementById('timerDisplay');
      if (d) { d.textContent = '0:00'; d.className = 'timer-display'; }
      playTimerSound();
    }
  }, 1000);
}

function pauseTimer() {
  if (!timerRunning) return;
  clearInterval(timerInterval);
  timerRunning = false;
  setPlayPauseText('Play');
  updateTimerDisplay();
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  timerTarget  = 0;
  setPlayPauseText('Play');
  const d = document.getElementById('timerDisplay');
  if (d) { d.textContent = '0:00'; d.className = 'timer-display'; }
}

function setPlayPauseText(text) {
  const btn = document.getElementById('playPauseBtn');
  if (btn) btn.textContent = text;
}

function updateTimerDisplay() {
  const m = Math.floor(Math.abs(timerSeconds) / 60);
  const s = Math.abs(timerSeconds) % 60;
  const d = document.getElementById('timerDisplay');
  if (!d) return;
  d.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  d.className = timerRunning ? 'timer-display running' : 'timer-display';
}

// ══════════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════════
let audioCtx = null;

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

document.addEventListener('touchstart', () => ensureAudioCtx(), { passive: true });
document.addEventListener('click',      () => ensureAudioCtx(), { passive: true });

function playTimerSound() {
  try {
    const ctx = ensureAudioCtx();
    [[880,0,0.12],[880,0.16,0.12],[1100,0.32,0.28]].forEach(([freq,start,dur]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, ctx.currentTime + start);
      g.gain.linearRampToValueAtTime(1.0, ctx.currentTime + start + 0.01);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    });
  } catch(e) {}
}

// ══════════════════════════════════════════════════
// PDF UPLOAD
// ══════════════════════════════════════════════════
function showUpload() { document.getElementById('uploadOverlay').classList.add('visible'); }
function hideUpload() { document.getElementById('uploadOverlay').classList.remove('visible'); }

function viewPDF() {
  const b64 = localStorage.getItem('wt_pdf_base64');
  if (!b64) return;
  const bytes = new Uint8Array(atob(b64).split('').map(c => c.charCodeAt(0)));
  const url = URL.createObjectURL(new Blob([bytes], { type:'application/pdf' }));
  window.open(url, '_blank');
}

async function handlePDFUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  hideUpload();

  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const buf = await file.arrayBuffer();
  localStorage.setItem('wt_pdf_base64', btoa(String.fromCharCode(...new Uint8Array(buf))));
  document.getElementById('viewPdfBtn').style.display = '';

  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc   = await page.getTextContent();
    text += tc.items.map(it => it.str).join(' ') + '\n';
  }

  const parsed = parsePDFText(text);
  if (parsed) {
    workout = parsed;
    sets = {}; started = {}; orderUnlocked = {};
    saveState();
    localStorage.setItem('wt_workout', JSON.stringify(workout));
    render();
  } else {
    alert("Could not parse the PDF. Make sure you're uploading your Weekly Workout Plan.");
  }
  event.target.value = '';
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

function parsePDFText(text) {
  text = text.replace(/\s+/g, ' ').trim();
  const result   = {};
  const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const dayPat   = new RegExp(`(${dayNames.join('|')})\\s*[—–-]`, 'g');
  const positions = [];
  let match;
  while ((match = dayPat.exec(text)) !== null) positions.push({ day:match[1], start:match.index });

  positions.forEach((pos, idx) => {
    const end   = idx + 1 < positions.length ? positions[idx+1].start : text.length;
    const block = text.slice(pos.start, end);
    const day   = pos.day;

    if (day === 'Saturday' || day === 'Sunday') {
      const rm = block.match(/Peloton[^.•\n]*/i);
      result[day] = { title:`${day} — Ride Day`, type:'workout', sections:[
        { label:'🚴 Cardio', type:'cardio', cardioText: rm ? rm[0].trim() : 'Peloton Planned Ride — 45 min' },
      ]};
      return;
    }

    const titleMatch = block.match(new RegExp(`${day}\\s*[—–-]\\s*([^\\n]+)`));
    const subtitle   = titleMatch ? titleMatch[1].replace(/[🥵💀🔥🚴🏋]/g,'').trim() : '';
    const sections   = [];

    const mainMatch = block.match(/Main Work(.+?)(?=Finisher|Core Finisher|Cardio|$)/si);
    if (mainMatch) {
      const ex = extractExercises(mainMatch[1]);
      if (ex.length) sections.push({ label:'🥵 Main Work', type:'main', rest:'Rest 2 minutes between sets', exercises:ex });
    }
    const finMatch = block.match(/(?<!Core\s)Finisher(?!\s*[–—])(.+?)(?=Core Finisher|Cardio|$)/si);
    if (finMatch) {
      const ex = extractExercises(finMatch[1]);
      if (ex.length) sections.push({ label:'🔥 Finisher', type:'finish', rest:'Rest 30 seconds between sets', exercises:ex });
    }
    const coreMatch = block.match(/Core Finisher(.+?)(?=Cardio|$)/si);
    if (coreMatch) {
      const ex = extractExercises(coreMatch[1]);
      if (ex.length) sections.push({ label:'💀 Core Finisher', type:'core', rest:'Rest 30 seconds between sets', exercises:ex });
    }
    const cardioMatch = block.match(/Cardio\s+(.+?)(?=Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|$)/si);
    const cardioText  = cardioMatch
      ? cardioMatch[1].replace(/Rest\s+\d+[^.]*between sets/gi,'').trim().split(/\s{2,}/)[0].trim()
      : '';
    if (cardioText) sections.push({ label:'🚴 Cardio', type:'cardio', cardioText });

    result[day] = { title: subtitle ? `${day} — ${subtitle}` : day, type:'workout', sections };
  });

  return Object.keys(result).length >= 5 ? result : null;
}

function extractExercises(text) {
  text = text.replace(/Main Work|Finisher|Core Finisher|Cardio/gi,'')
             .replace(/Rest\s+\d+[^.]*between sets/gi,'')
             .replace(/[🥵💀🔥🚴🏋]/g,'').trim();
  const lines = text.split(/☐|•|\n/)
    .map(l => l.trim())
    .filter(l => l.length > 4 && /[a-zA-Z]{3,}/.test(l) && !l.match(/^(rest|repeat|note)/i));
  const seen = new Set();
  return lines.filter(l => {
    const k = l.toLowerCase().replace(/\s+/g,'');
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).slice(0,10);
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
(function init() {
  // Weekly auto-reset
  const currentWeek = getWeekKey();
  const storedWeek  = localStorage.getItem('wt_week');
  if (storedWeek && storedWeek !== currentWeek) {
    Object.keys(localStorage).forEach(k => { if (k.startsWith('wt_state_')) localStorage.removeItem(k); });
  }
  localStorage.setItem('wt_week', currentWeek);

  // Clear stale daily state
  const today = todayKey();
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith('wt_state_') && !k.endsWith(today)) localStorage.removeItem(k);
  });

  if (localStorage.getItem('wt_pdf_base64')) document.getElementById('viewPdfBtn').style.display = '';

  loadState();
  render();

  setTimeout(() => {
    const sel = document.getElementById('daySelector');
    const idx = DAYS.indexOf(currentDay);
    if (sel && sel.children[idx]) sel.children[idx].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }, 100);
})();
</script>
</body>
</html>
